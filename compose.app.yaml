# Optional API/worker/web containers. The web UI can still run locally with pnpm dev.
# First: docker compose -f compose.yaml -f compose.app.yaml run --rm migrate
# Then: docker compose -f compose.yaml -f compose.app.yaml up -d api worker web
# Tailscale-only exposure (no host ports for web): add -f compose.tailscale.yaml.
services:
  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:?Set the local database password}@db:5432/fener
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:?Set the local database password}@db:5432/fener
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["snapshots:/app/.data/snapshots"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:?Set the local database password}@db:5432/fener
    command: ["fener", "worker"]
    volumes: ["snapshots:/app/.data/snapshots"]
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    env_file: .env
    environment:
      FENER_API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  snapshots:
