# Optional API/worker containers. Web runs locally with pnpm dev.
# First: docker compose -f compose.yaml -f compose.app.yaml run --rm migrate
# Then: docker compose -f compose.yaml -f compose.app.yaml up -d api worker
services:
  migrate:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:-fener_local}@db:5432/fener
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:-fener_local}@db:5432/fener
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["snapshots:/app/.data/snapshots"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fener:${POSTGRES_PASSWORD:-fener_local}@db:5432/fener
    command: ["fener", "worker"]
    volumes: ["snapshots:/app/.data/snapshots"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  snapshots:
