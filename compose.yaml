services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: fener
      POSTGRES_USER: fener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fener_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fener -d fener"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
