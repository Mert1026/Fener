[project]
name = "fener"
version = "0.1.0"
description = "Provenance-first AI model intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "tenacity>=9,<10", "typer>=0.15,<1", "structlog>=25,<27",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/api/fener", "services/worker/fener_worker"]
[project.scripts]
fener = "fener_worker.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "services/worker"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fener", "fener_worker"]
mypy_path = "services/api:services/worker"
