name: Validate Fener
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a disposable database credential
        shell: python
        run: |
          import os, secrets
          password = secrets.token_hex(32)
          print(f"::add-mask::{password}")
          url = f"postgresql+psycopg://fener:{password}@localhost:5432/fener"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(f"POSTGRES_PASSWORD={password}\nDATABASE_URL={url}\nFENER_TEST_POSTGRES_URL={url}\n")
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name fener-ci-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=fener -e POSTGRES_DB=fener -e POSTGRES_PASSWORD postgres:17.9-alpine
          for attempt in {1..30}; do
            if docker exec fener-ci-db pg_isready -U fener -d fener; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check services tests scripts
      - run: uv run ruff format --check services tests scripts
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q --cov=fener --cov-report=term-missing
      - run: uv run python scripts/schema.py --check
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f fener-ci-db
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
