services:
  db:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fener
      POSTGRES_USER: fener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup to generate a local database password}
    ports:
      - "127.0.0.1:${FENER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fener -d fener"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
