name: Validate Fener
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: fener
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: fener
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fener -d fener"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fener:ci_only@localhost:5432/fener
      FENER_TEST_POSTGRES_URL: postgresql+psycopg://fener:ci_only@localhost:5432/fener
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check services tests scripts
      - run: uv run ruff format --check services tests scripts
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q --cov=fener --cov-report=term-missing
      - run: uv run python scripts/schema.py --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
